[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rulebook-agents"
dynamic = ["version"]
description = "Plain-English coding rules, turned into tested Semgrep rules and enforced on every pull request."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hesham Rashid" }, { name = "Zachary Zambrana" }]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "anthropic>=0.40",
]
# Semgrep is a separate tool, not a Python dependency: installed next to other packages
# it can break them. Install it with `uv tool install semgrep` or `pipx install semgrep`.

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rulebook = "rulebook.cli:main"

[project.urls]
Repository = "https://github.com/hrashid13/Rulebook-Agents"

[tool.hatch.version]
path = "src/rulebook/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rulebook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
