rules:
  - id: no-hardcoded-secrets-go
    languages: [go]
    severity: ERROR
    message: hardcoded secret
    patterns:
      - pattern-either:
          - pattern: const $NAME = "$VALUE"
          - pattern: var $NAME = "$VALUE"
          - pattern: $NAME := "$VALUE"
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(key|secret|password|token).*
