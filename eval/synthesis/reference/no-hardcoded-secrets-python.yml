rules:
  - id: no-hardcoded-secrets-python
    languages: [python]
    severity: ERROR
    message: hardcoded secret
    patterns:
      - pattern: $NAME = "$VALUE"
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(key|secret|password|token).*
      - metavariable-regex:
          metavariable: $VALUE
          regex: .+
