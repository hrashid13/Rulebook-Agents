rules:
  - id: no-hardcoded-secrets-typescript
    languages: [typescript]
    severity: ERROR
    message: hardcoded secret
    pattern-either:
      - patterns:
          - pattern: const $NAME = "$VALUE";
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i).*(key|secret|password|token).*
      - patterns:
          - pattern-inside: "{...}"
          - pattern: '$NAME: "$VALUE"'
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i).*(key|secret|password|token).*
